[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-mlx"
version = "1.0.0"
description = "autotrust/JEV-35B on Apple Silicon (MLX): System 1 decisions with calibrated probabilities, text and images"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "Paris Michalas, NetProjects (Internet Projects Ltd)"}]
dependencies = ["mlx>=0.32", "mlx-vlm>=0.7.6", "huggingface_hub", "pillow"]

[project.urls]
Homepage = "https://github.com/internet-projects/jev35b-mlx"
Weights = "https://huggingface.co/netprojects"

[tool.setuptools]
packages = ["jev_mlx"]
